<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14322b">
<title>Replanteo de obra</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#16211d;--mut:#5d6b65;--line:#dde3df;--hd:#14322b;--acc:#f26a1b;--ok:#1f8a4c;--warn:#c98a00;--bad:#c63b2f;--soft:#e8efe9}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--hd);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;line-height:1.2;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header small{display:block;font-weight:400;opacity:.75;font-size:12.5px}
.back{background:none;border:0;color:#fff;font-size:26px;width:40px;height:40px;border-radius:10px;cursor:pointer}
.back[hidden]{display:none}
main{padding:14px 14px 110px;max-width:760px;margin:0 auto}
nav.tab{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tab button{flex:1;border:0;background:none;padding:9px 4px 10px;font:600 12.5px system-ui;color:var(--mut);cursor:pointer}
nav.tab button b{display:block;font-size:20px;line-height:1.1}
nav.tab button.on{color:var(--hd)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ct{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.ct h2{margin:0 0 2px;font-size:17px}
.mut{color:var(--mut);font-size:13.5px}
.row{display:flex;gap:10px;align-items:center}
.row>.grow{flex:1}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.big{font-size:28px;font-weight:800;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 0}
.stats div{background:var(--soft);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:20px}
.stats span{font-size:12px;color:var(--mut)}
h3{font-size:15px;margin:18px 0 8px;color:var(--hd)}
.list .it{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff}
.list .it:first-child{border-radius:14px 14px 0 0}.list .it:last-child{border-bottom:0;border-radius:0 0 14px 14px}
.list{border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:#c4ccc8}
.dot.ok{background:var(--ok)}.dot.mid{background:var(--warn)}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--soft);color:var(--mut);white-space:nowrap}
.pill.ok{background:#dff3e6;color:var(--ok)}.pill.mid{background:#fbf0d2;color:#8a5f00}.pill.new{background:#ffe6d6;color:#b44b0f}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font:700 15px system-ui;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--hd);color:#fff;border-color:var(--hd)}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.bad{color:var(--bad)}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1 1 140px}
label.f{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:10px 0 4px}
input,textarea,select{width:100%;font:16px system-ui;padding:11px 12px;border:1px solid #c9d2cd;border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus,select:focus,.btn:focus-visible{outline:3px solid #f6a674;outline-offset:1px}
.search{margin-bottom:12px}
.slot{border-top:1px solid var(--line);padding:12px 0}
.slot:first-of-type{border-top:0}
.slot .hd{display:flex;align-items:center;gap:8px}
.slot .hd>span:first-child{flex:1;font-weight:600}
.grow{flex:1}
.req{color:var(--bad);font-weight:800}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ph .th{position:relative;width:86px;height:86px;border-radius:10px;overflow:hidden;background:#ddd}
.ph .th img{width:100%;height:100%;object-fit:cover}
.ph .th button{position:absolute;top:3px;right:3px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px}
.cam{width:86px;height:86px;border-radius:10px;border:2px dashed #b9c4be;background:#fafbfa;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 12px system-ui;color:var(--mut);cursor:pointer}
.cam b{font-size:24px;color:var(--hd)}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;font-weight:600}
.chk input{width:24px;height:24px;flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;border:0;background:#fff;padding:12px 6px;font:700 14px system-ui;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--hd);color:#fff}
.gps{background:var(--soft);border-radius:10px;padding:10px;font-size:14px;margin-top:8px}
.flag{width:34px;height:34px;flex:none;border-radius:8px;background:#ffe6d6;color:#b44b0f;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#16211d;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 6px;font-size:18px}
.viewer{position:fixed;inset:0;background:#000;z-index:30;display:none;align-items:center;justify-content:center}
.viewer.on{display:flex}.viewer img{max-width:100%;max-height:100%}
.viewer button{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:10px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.warn{background:#fff4e0;border:1px solid #f1d39a;border-radius:10px;padding:10px;font-size:14px;margin-bottom:12px}
.sync{border:0;border-radius:20px;padding:7px 11px;font:700 12px system-ui;cursor:pointer;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.sync.ok{background:#2c6b4d;color:#fff}.sync.pend{background:#f26a1b;color:#fff}.sync.run{background:#fff;color:#14322b}.sync.off{background:rgba(255,255,255,.15);color:#fff}
.gps-chip{border-radius:20px;padding:7px 10px;font:700 12px system-ui;white-space:nowrap;flex:none}.gps-chip.ok{background:#2c6b4d;color:#fff}.gps-chip.mid{background:#c98a00;color:#fff}.gps-chip.bad{background:rgba(255,255,255,.15);color:#fff}
@media(max-width:420px){.sync{max-width:34vw}}
.grid2{display:grid;gap:12px}.grid2>.card{margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px;font:600 13.5px system-ui;color:var(--mut);cursor:pointer;min-height:38px}
.chips button.on{background:var(--hd);border-color:var(--hd);color:#fff}
.side-title{display:none}
@media (min-width:900px){
header{padding-left:236px}
nav.tab{top:0;bottom:0;right:auto;width:220px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:16px 10px;gap:4px;z-index:7}
nav.tab .side-title{display:block;font:800 17px system-ui;color:var(--hd);padding:6px 12px 14px}
nav.tab button{flex:none;display:flex;align-items:center;gap:12px;text-align:left;padding:12px;border-radius:10px;font-size:15px}
nav.tab button b{display:inline;font-size:20px;width:24px;text-align:center}
nav.tab button.on{background:var(--soft)}
main{margin-left:220px;max-width:1180px;padding:22px 28px 60px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.cols>.card{margin:0}.cols>.wide{grid-column:1/-1}
.vlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px;border:0}
.vlist .it{border:1px solid var(--line);border-radius:12px!important;margin-bottom:8px}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}.slots h3{grid-column:1/-1}.slots .slot:first-of-type{border-top:1px solid var(--line)}
.toast{bottom:30px}
.modal{align-items:center}.sheet{border-radius:18px;max-width:520px}
}
@media (min-width:1300px){.vlist{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

<header>
<button class="back" id="back" hidden aria-label="Volver">‹</button>
<h1 id="ttl">Replanteo de obra<small id="sub">Registro fotográfico y usuarios</small></h1>

<button class="sync off" id="sync">…</button>
</header>
<main id="main"></main>
<nav class="tab">
<div class="side-title">Replanteo de obra</div>

</nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="viewer" id="viewer"><img id="vimg" alt=""><button class="btn" id="vclose">Cerrar</button></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileGal" accept="image/*" multiple hidden>
